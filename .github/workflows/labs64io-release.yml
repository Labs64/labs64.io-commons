name: Labs64.IO - Commons - Release

# Releases labs64io-parent and ALL commons Java libraries at one version.
#
# Trigger: publish a GitHub Release whose tag is the version (X.Y.Z). The tagged commit
# is built with -Drevision=<tag> and deployed, GPG-signed, to Labs64 Nexus — nothing is
# committed back, and no pom is edited: poms carry no version of their own.
#
# workflow_dispatch replays a release: run it FROM THE TAG (not from a branch).
#
# Maven Central publishing is opt-in via the repository variable
# PUBLISH_MAVEN_CENTRAL=true (needs OSS_USER / OSS_PASS).

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commons-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Take the version from the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_TYPE" != "tag" ]]; then
            echo "::error::run this workflow from the release tag, not from a branch"; exit 1
          fi
          if ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$REF_NAME' is not a release version X.Y.Z"; exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ needs.version.outputs.version }}
    needs: version
    uses: Labs64/labs64.io-workspace/.github/workflows/maven-publish.yml@v1
    with:
      working-directory: .
      mode: release
      version: ${{ needs.version.outputs.version }}
      publish-central: ${{ vars.PUBLISH_MAVEN_CENTRAL == 'true' }}
    secrets: inherit
