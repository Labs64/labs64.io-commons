name: Labs64.IO - Commons - CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: commons-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One reactor (root pom.xml): labs64io-parent, then every Java library in
  # dependency order — no per-library jobs or pre-install steps to keep in sync.
  java:
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@v1
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      working-directory: .
      maven-goals: verify
      artifact-name: commons-test-reports

  python:
    uses: Labs64/labs64.io-workspace/.github/workflows/python-ci.yml@v1
    with:
      working-directory: auth-context-python
      # Unquoted on purpose: the reusable python-ci.yml expands this value via
      # an unquoted $INSTALL_CMD in bash, so literal quote characters here
      # would survive into pip's argv (pip then sees '".[dev]"' verbatim and
      # rejects it). `.[dev]` needs no quoting -- no single-letter d/e/v file
      # exists in auth-context-python/ for the shell to glob-match instead.
      install-command: pip install -q -e .[dev]
      test-command: pytest -q

  # Cerbos policy generation from OpenAPI x-labs64.auth,
  # followed by compile + truth-table gate
  # (repo-specific — stays inline).
  cerbos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cerbos compile + decision-equivalence truth-table gate
        run: ./auth-policy-cerbos/validate.sh

  # ── Snapshot publishing: only after ALL tests are green, only on master pushes.
  # Deploys labs64io-parent and every library as 0.0.0-SNAPSHOT — what a module
  # resolves while it temporarily points at unreleased commons. Releases are cut by
  # labs64io-release.yml (a GitHub Release), never from here.
  snapshot:
    needs: [java, python, cerbos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: Labs64/labs64.io-workspace/.github/workflows/maven-publish.yml@v1
    with:
      working-directory: .
      mode: snapshot
    secrets: inherit
