<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Labs64.IO Commons</title>
<desc id="d">The same payments:read rule written three ways, as a Java annotation, a Python decorator and a generated Cerbos policy, each returning the same ALLOW from one set of shared test vectors.</desc>
<defs>
<radialGradient id="hg1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E14817" stop-opacity=".45"/><stop offset="1" stop-color="#E14817" stop-opacity="0"/></radialGradient>
<radialGradient id="hg2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2951C" stop-opacity=".22"/><stop offset="1" stop-color="#F2951C" stop-opacity="0"/></radialGradient>
<pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F8EDE5" stroke-opacity=".06"/></pattern>
<filter id="hglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="hwin"><rect width="1200" height="640" rx="18"/></clipPath>
<style>
    .sans{font-family:Roboto,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    text{white-space:pre}
    @media (prefers-reduced-motion: reduce){ animate, animateMotion, animateTransform{display:none} }
  </style>
</defs>
<g clip-path="url(#hwin)">
<rect width="1200" height="640" fill="#170A05"/><rect width="1200" height="640" fill="url(#hgrid)"/>
<ellipse cx="180" cy="40" rx="420" ry="300" fill="url(#hg1)"/><ellipse cx="1040" cy="560" rx="360" ry="260" fill="url(#hg2)"/>
<rect width="1200" height="44" fill="#22100A"/><line x1="0" y1="44" x2="1200" y2="44" stroke="#F8EDE5" stroke-opacity=".1"/>
<circle cx="28" cy="22" r="6" fill="#E14817"/><circle cx="50" cy="22" r="6" fill="#F2951C"/><circle cx="72" cy="22" r="6" fill="#87888A"/>
<text x="600" y="27" class="mono" font-size="13" fill="#87888A" text-anchor="middle" letter-spacing="0.5">labs64.io-commons · labs64io-parent</text>
<text x="64" y="100" class="sans" font-size="13" font-weight="500" fill="#F08B53" letter-spacing="3.6">LABS64.IO  ·  COMMONS</text>
<text x="64" y="156" class="sans" font-size="48" font-weight="700" fill="#F8EDE5" letter-spacing="-1.4">Write the plumbing once.</text>
<text x="64" y="212" class="sans" font-size="48" font-weight="700" fill="#E14817" letter-spacing="-1.4">Every service behaves the same.</text>
<text x="1136" y="212" class="mono" font-size="14" fill="#F8EDE5" fill-opacity="0.6" text-anchor="end">Java 17+  ·  Python 3.13  ·  Maven Central</text>
<rect x="64" y="252" width="1072" height="304" rx="16" fill="#F8EDE5" fill-opacity=".035" stroke="#F8EDE5" stroke-opacity=".22"/><rect x="74" y="262" width="1052" height="284" rx="10" fill="none" stroke="#F8EDE5" stroke-opacity=".08"/><rect x="492.15" y="284" width="170.75" height="30" rx="5" fill="#E14817" opacity=".12"><animate attributeName="opacity" values=".12;.12;.85;.85;.4;.4;.85;.12" keyTimes="0;0.000;0.025;0.233;0.267;.8;.84;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="100" y="304" class="mono" font-size="14" font-weight="500" fill="#F8EDE5" letter-spacing="3">JAVA</text><text x="100" y="324" class="mono" font-size="11.5" fill="#F08B53">Spring Boot 4</text><text x="290" y="305" class="mono" font-size="18" fill="#F8EDE5">@Authorize(scope = "payments:read")</text><text x="290" y="332" class="mono" font-size="13" fill="#87888A">ResponseEntity&lt;Payment&gt; get(@PathVariable String id)</text><g opacity=".25"><animate attributeName="opacity" values=".25;.25;1;1;.25" keyTimes="0;0.033;0.050;.97;1" dur="6s" begin="0s" repeatCount="indefinite"/><rect x="1010" y="286" width="96" height="28" rx="6" fill="none" stroke="#E14817" stroke-width="2"/><text x="1058" y="305" class="mono" font-size="13" font-weight="500" fill="#E14817" text-anchor="middle" letter-spacing="2">ALLOW</text></g><path d="M96,358 H1104" stroke="#F8EDE5" stroke-opacity=".12" stroke-dasharray="2 6"/><rect x="470.45" y="380" width="170.75" height="30" rx="5" fill="#E14817" opacity=".12"><animate attributeName="opacity" values=".12;.12;.85;.85;.4;.4;.85;.12" keyTimes="0;0.267;0.292;0.500;0.533;.8;.84;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="100" y="400" class="mono" font-size="14" font-weight="500" fill="#F8EDE5" letter-spacing="3">PYTHON</text><text x="100" y="420" class="mono" font-size="11.5" fill="#F08B53">FastAPI</text><text x="290" y="401" class="mono" font-size="18" fill="#F8EDE5">@authorize(scope="payments:read")</text><text x="290" y="428" class="mono" font-size="13" fill="#87888A">async def get_payment(id: str) -&gt; Payment:</text><g opacity=".25"><animate attributeName="opacity" values=".25;.25;1;1;.25" keyTimes="0;0.300;0.317;.97;1" dur="6s" begin="0s" repeatCount="indefinite"/><rect x="1010" y="382" width="96" height="28" rx="6" fill="none" stroke="#E14817" stroke-width="2"/><text x="1058" y="401" class="mono" font-size="13" font-weight="500" fill="#E14817" text-anchor="middle" letter-spacing="2">ALLOW</text></g><path d="M96,454 H1104" stroke="#F8EDE5" stroke-opacity=".12" stroke-dasharray="2 6"/><rect x="600.65" y="476" width="170.75" height="30" rx="5" fill="#E14817" opacity=".12"><animate attributeName="opacity" values=".12;.12;.85;.85;.4;.4;.85;.12" keyTimes="0;0.533;0.558;0.767;0.800;.8;.84;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="100" y="496" class="mono" font-size="14" font-weight="500" fill="#F8EDE5" letter-spacing="3">POLICY</text><text x="100" y="516" class="mono" font-size="11.5" fill="#F08B53">Cerbos, generated</text><text x="290" y="497" class="mono" font-size="18" fill="#F8EDE5">- actions: ["get"]   roles: ["payments:read"]</text><text x="290" y="524" class="mono" font-size="13" fill="#87888A">  effect: EFFECT_ALLOW   # from openapi.yaml</text><g opacity=".25"><animate attributeName="opacity" values=".25;.25;1;1;.25" keyTimes="0;0.567;0.583;.97;1" dur="6s" begin="0s" repeatCount="indefinite"/><rect x="1010" y="478" width="96" height="28" rx="6" fill="none" stroke="#E14817" stroke-width="2"/><text x="1058" y="497" class="mono" font-size="13" font-weight="500" fill="#E14817" text-anchor="middle" letter-spacing="2">ALLOW</text></g><text x="600" y="546" class="mono" font-size="12" fill="#87888A" text-anchor="middle">one rule · three dialects · one set of test vectors</text>
<text x="64" y="598" class="mono" font-size="13" fill="#87888A">Apache-2.0 · io.labs64 on Maven Central</text>
<text x="1136" y="598" class="mono" font-size="13" fill="#F08B53" text-anchor="end">labs64.io/docs</text>
